apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-helm
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/mayanksinghal1/argocd-demo.git
    targetRevision: main
    path: charts/nginx

  destination:
    server: https://kubernetes.default.svc
    namespace: demo-helm

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
